<!--aqui fica o início do site, basicamente nenhum
usuário vai ver está parte mas ela é de extrema importância 
para o site poder funcionar do jeito correto-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado da consulta</title>
    <link rel="stylesheet" href="style.css">
</head>

<!--Aqui fica o body o corpo do meu sistema, praticamente a 
parte principal sempre vai ficar aqui,aqui fica a maioria das 
informações e utilidades do sistema o h1 cria o titulo principal,
o p cria um parágrafo e a id linkmaps faz com que caso o 
usuário clique em cima do texto ele vá para a 
localização destinada-->
<body>
    <h1>Resultado da consulta</h1>
    <div id="resultado" role="status" aria-live="polite"></div>
    <a id="linkMaps" hidden target="_blank" rel="noopener noreferrer" class="linkmaps">Abrir no Google Maps</a>
    <p><a href="index.html">Fazer nova consulta</a></p>
    <script src="resultado.js"></script>
</body>

</html>
