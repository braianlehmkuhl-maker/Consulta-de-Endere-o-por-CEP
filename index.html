<!--aqui fica o início do site, basicamente nenhum
usuário vai ver está parte mas ela é de extrema importância 
para o site poder funcionar do jeito correto-->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Endereço por CEP</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="index.js">
<link rel="manifest" href="manifest.json">

</head>


<!--Aqui fica o body o corpo do meu sistema, praticamente a 
parte principal sempre vai ficar aqui,aqui fica a maioria das 
informações e utilidades do sistema
o class ele é utilizado para você consegui utilizar o CSS
com os seus comando e deixar ele mais bonito visualmente 
junto com o center que deixa tudo no centro da página
o label serve para mostrar como se fosse uma legenda e o 
input serve para criar a caixa onde o usuário consgue escrever dentro-->
<body class="body">
    <center><h1>Consultar Endereço</h1></center>
    <center><p>Digite os dados para consultar</p></center>
    <form id="formConsulta" class="consulta">
        <center>
            <br>
        <label for="cep">CEP</label>
        <input id="cep" type="text" inputmode="numeric" maxlength="9" placeholder="01001-000" required>
        <br>
        <label for="cidade">Cidade</label>
        <input id="cidade" type="text" placeholder="São Paulo" required>
        <br>
        <button type="submit">Consultar Endereço</button>
        <br>
    </center>
    </form>
    <p id="mensagem" role="status" aria-live="polite"></p>
    <script src="index.js"></script>
</body>

</html>
